<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">

<!-- Subtle Ambient Shadow/Glow -->

<h2 class="font-headline-md text-headline-md mb-2">Verify your identity</h2>
<p class="font-body-main text-body-main text-on-surface-variant">
                Enter the 6-digit verification code sent to your registered authentication method.
            </p>
</div>
<!-- Form -->
<form class="space-y-8 relative z-10">
<!-- OTP Inputs -->
<div class="flex justify-between gap-2" id="otp-container">
<input autofocus="" class="otp-input bg-surface border border-white/5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input bg-surface border border-white/5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input bg-surface border border-white/5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input bg-surface border border-white/5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input bg-surface border border-white/5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input bg-surface border border-white/5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" maxlength="1" type="number"/>
</div>
<!-- Action -->
<button class="w-full bg-[#3B82F6] hover:bg-primary-container text-white font-label-sm text-label-sm py-3 rounded-lg transition-colors flex items-center justify-center gap-2" type="submit">
<span>Verify</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Footer Actions -->
<div class="text-center">
<p class="font-body-main text-body-main text-on-surface-variant mb-1">
                    Didn't receive a code?
                </p>
<button class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors inline-flex items-center gap-1" disabled="" id="resend-btn" type="button">
<span>Resend code</span>
<span class="text-on-surface-variant" id="countdown">(00:59)</span>
</button>
</div>
</form>
<!-- Security Footer -->
<div class="mt-8 pt-4 border-t border-white/5 flex items-center justify-center gap-2 font-metadata-caps text-metadata-caps text-on-surface-variant relative z-10">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span>Session protected · Audit logging enabled</span>
</div>
</main>
<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Countdown Logic
        let timeLeft = 59;
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resend-btn');

        const timer = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft.toString().padStart(2, '0');
            countdownEl.textContent = `(00:${seconds})`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.textContent = '';
                resendBtn.disabled = false;
                resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }, 1000);
    </script>
