<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg font-black text-primary mb-2 tracking-tighter">SIPER</h1>
<p class="font-body-main text-body-main text-on-surface-variant">Ministry of Home Affairs — Authorized Personnel Only</p>
</div>
<!-- Form -->
<form class="space-y-6">
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="identifier">Email / Government ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">badge</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-md py-2.5 pl-10 pr-3 text-on-surface font-body-main focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50" id="identifier" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">key</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-md py-2.5 pl-10 pr-3 text-on-surface font-body-main focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
</div>
</div>

<button class="w-full h-[44px] flex items-center justify-center bg-primary-container text-on-primary-container font-label-sm text-label-sm font-bold rounded-md hover:bg-primary-container/90 transition-colors" type="button">

<span class="material-symbols-outlined text-[18px]">fingerprint</span>

        </button>
