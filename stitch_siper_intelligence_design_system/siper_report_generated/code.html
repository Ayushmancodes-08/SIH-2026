<!DOCTYPE html>

                        "error-container": "#93000a",

                        "on-surface": "#e3e2e5",

                    spacing: {
                        "panel-gutter": "16px",
                        "grid-columns": "12",
                        "component-padding-y": "8px",
                        "base": "4px",
                        "container-margin": "24px",
                        "component-padding-x": "12px"
                    },
                    fontFamily: {
                        "section-title": ["Inter", "sans-serif"],
                        "body-main": ["Inter", "sans-serif"],
                        "display-lg": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "label-sm": ["Inter", "sans-serif"],
                        "metadata-caps": ["Inter", "sans-serif"]

                    fontSize: {
                        "section-title": ["18px", { "lineHeight": "1.4", "fontWeight": "500" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-blur-overlay {
            backdrop-filter: blur(20px);
            background-color: rgba(18, 19, 21, 0.85); /* background color with opacity */
        }
    </style>

<body class="bg-background text-on-background font-body-main antialiased h-screen w-screen overflow-hidden relative">
<!-- Blurred Background Context (Simulated Report Preview) -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none" data-alt="A highly complex, dark-mode intelligence dashboard screen showing numerous data charts, network graphs, and textual analysis panels. The aesthetic is cybernetic and military-grade, with glowing blue and subdued grey tones over a pitch-black background. Abstract glowing nodes and lines represent interconnected criminal data points." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBrJZ6ld9T-Ch1_Yf9zF1A4c3JtGmwOaM7AWJNiU8jpkTWAXM4-dBjWjEk719Tsrd8qIeYMoic_ICy0WZohfZ_lFFMpxhF3Lm1XNMO09KgN9_KM0uvhTZY-gvcDnEu39FlyJt9iLnidcBlI5_V-Al4m-e7gVg_2pE6uUnWwX5O9vQr_6FcamXKyboP61BAiWQemrMdhy2ss3IPI77foSVGy3sNrnek5s-jFPgu3MetoDbqoYkg6h_cYWw')">
<!-- Overlay to ensure the success modal pops -->
<div class="absolute inset-0 bg-background/60"></div>
</div>
<!-- Success Modal Container -->
<div class="absolute inset-0 z-50 flex items-center justify-center p-4">
<!-- Modal Card -->
<div class="bg-surface-container-highest border border-white/5 rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] w-full max-w-md overflow-hidden relative">
<!-- Success Indicator Header -->
<div class="pt-8 pb-6 px-6 flex flex-col items-center justify-center border-b border-white/5">
<div class="w-16 h-16 rounded-full bg-primary/20 flex items-center justify-center mb-4 border border-primary/30">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface text-center">Report Generated Successfully</h2>
<p class="font-body-main text-body-main text-on-surface-variant text-center mt-2">The analysis document has been finalized and securely stored in the active case repository.</p>
</div>
<!-- Details Section -->
<div class="px-6 py-4 bg-surface-container/50">
<div class="flex justify-between items-center py-2 border-b border-white/5">
<span class="font-metadata-caps text-metadata-caps text-on-surface-variant">Report ID</span>
<span class="font-label-sm text-label-sm text-on-surface font-mono bg-surface-container px-2 py-1 rounded border border-white/5">REP-9421-B</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-metadata-caps text-metadata-caps text-on-surface-variant">Linked Case</span>
<span class="font-label-sm text-label-sm text-primary font-mono cursor-pointer hover:underline">CASE-26189</span>
</div>
</div>
<!-- Action Buttons -->
<div class="px-6 py-6 flex flex-col gap-3">
<button class="w-full bg-[#3B82F6] hover:bg-blue-600 text-white font-label-sm text-label-sm py-3 px-4 rounded transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
                    View Report
                </button>
<div class="flex gap-3">
<button class="flex-1 bg-transparent border border-white/20 hover:bg-surface-variant text-on-surface font-label-sm text-label-sm py-3 px-4 rounded transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="picture_as_pdf">picture_as_pdf</span>
                        Export PDF
                    </button>
<button class="flex-1 bg-transparent hover:bg-surface-variant text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm py-3 px-4 rounded transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
                        Return to Case
                    </button>
</div>
</div>
<!-- Subtle Decorative Element -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary/40"></div>
</div>
</div>
